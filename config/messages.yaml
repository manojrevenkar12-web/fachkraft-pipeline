    recognition: "Твій диплом уже визнано в Німеччині (Anerkennung), заява в процесі чи ще ні?"
    licences: "Які в тебе посвідчення чи допуски (напр. B, C, CE, Code 95, навантажувач, ADR)?"
    location: "Де ти живеш? Достатньо поштового індексу."
    commute: "Як далеко максимум ти можеш їздити на роботу (км або хвилини)?"
    shifts: "Які зміни тобі підходять: ранкова, вечірня, нічна, вихідні?"
    start_date: "Коли ти можеш почати?"
    german_level: "Як добре ти говориш німецькою (напр. A2, B1, B2 або своїми словами)?"
    experience_years: "Скільки років досвіду роботи ти маєш?"
    employment: "Шукаєш повний чи неповний робочий день?"
    email: "Для заявки нам ще потрібна твоя електронна адреса."
    full_name: "Як тебе звати (ім'я та прізвище)?"
  confirm: "Я записав:\n{summary}\nВсе правильно?"
  confirm_yes: "Правильно"
  confirm_fix: "Виправити"
