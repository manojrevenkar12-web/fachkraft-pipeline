ads:
  - id: "ad-001"
    title: "Koch (m/w/d) für unser Bistro am Hafen"
    text: "Das Bistro Kielwasser in Bremerhaven sucht ab sofort Verstärkung in der Küche. Du bereitest regionale Fischgerichte zu, kümmerst dich um die Mise en place und achtest auf saubere Abläufe. Voraussetzung ist eine abgeschlossene Ausbildung als Koch oder Köchin sowie die Belehrung nach § 43 IfSG (Gesundheitszeugnis). Wir bieten feste Dienstpläne, Trinkgeldbeteiligung und 30 Tage Urlaub. Bewerbung an jobs@kielwasser-bistro.example."
    expect: []

  - id: "ad-002"
    title: "Pflegefachkraft (m/w/d) ambulanter Dienst"
    text: "Der Pflegedienst Lindenhof in Kassel versorgt rund 120 Klientinnen und Klienten im Stadtgebiet. Sie übernehmen Grund- und Behandlungspflege, dokumentieren digital und arbeiten eng mit Hausarztpraxen zusammen. Wir setzen Deutsch als Muttersprache voraus. Dienstwagen auch zur privaten Nutzung und Bezahlung angelehnt an den TVöD-P."
    expect: ["origin-native-language"]

  - id: "ad-003"
    title: "Lagerhelfer gesucht – Vollzeit"
    text: "Für unser Logistikzentrum bei Erfurt suchen wir zuverlässige Unterstützung im Zweischichtbetrieb. Sie kommissionieren Waren, bereiten Sendungen für den Versand vor und halten Ordnung auf der Fläche. Sie sind körperlich belastbar und packen gerne mit an. Schichtzulagen, Fahrtkostenzuschuss und eine Einarbeitung durch erfahrene Kolleginnen und Kollegen sind selbstverständlich."
    expect: ["gender-title", "physical"]

  - id: "ad-004"
    title: "Warehouse Associate (all genders) – Night Shift"
    text: "Nordlicht Fulfilment in Hamburg-Billbrook is hiring for our night shift. You will scan, pick and pack customer orders using handheld scanners. No previous experience needed – we train you during your first two weeks. English or German is fine for daily work; our shift leads speak both. Night bonus of 25% and a free shuttle from the S-Bahn station."
    expect: []

  - id: "ad-005"
    title: "Elektroniker*in für Energie- und Gebäudetechnik"
    text: "Elektro Brandauer GmbH in Regensburg installiert und wartet Anlagen in Wohn- und Gewerbebauten. Du verlegst Leitungen, baust Verteilungen auf und nimmst Anlagen nach VDE in Betrieb. Wir bieten einen Firmenwagen, tarifliche Bezahlung und bezahlte Weiterbildungen bis zum Meister. Wir freuen uns über alle Bewerbungen, unabhängig von Alter, Geschlecht, Herkunft, Religion oder Behinderung."
    german_level: {min: "B1", justification: "Sicherheitsunterweisungen und die Abstimmung mit Kundschaft auf der Baustelle finden auf Deutsch statt."}
    expect: []

  - id: "ad-006"
    title: "Verkäuferin für Bäckereifiliale"
    text: "Die Bäckerei Hollerbusch sucht für die Filiale in Bamberg-Gaustadt eine freundliche Verkäuferin in Teilzeit. Sie bedienen unsere Stammkundschaft, belegen Brötchen und halten die Theke sauber. Arbeitszeiten von 6 bis 12 Uhr, Wochenenddienste im Wechsel. Wir bieten Personalrabatt und ein herzliches Miteinander."
    expect: ["gender-title", "gender-only"]

  - id: "ad-007"
    title: "Berufskraftfahrer (m/w/d) CE im Nahverkehr"
    text: "Die Spedition Hollmann aus Bielefeld fährt seit über 40 Jahren für Industrie und Handel in Ostwestfalen. Du bist im Tagesverkehr unterwegs und abends zu Hause. Voraussetzungen: Führerschein CE mit Modul 95, Fahrerkarte, maximal 45 Jahre. Wir bieten moderne Fahrzeuge mit Vollausstattung und pünktliche Bezahlung über Tarif."
    expect: ["age"]

  - id: "ad-008"
    title: "Servicekraft (m/w/d) Restaurant Zur alten Mühle"
    text: "Unser Ausflugslokal an der Lahn sucht Unterstützung für die Saison von April bis Oktober. Sie nehmen Bestellungen auf, servieren und kassieren an der Terrasse. Erfahrung im Service ist hilfreich, aber kein Muss. Bitte senden Sie Ihre Bewerbung mit aktuellem Lichtbild an bewerbung@alte-muehle-lahn.example."
    expect: ["photo"]

  - id: "ad-009"
    title: "Junior Mechatroniker (m/w/d) – auch Berufseinstieg"
    text: "Du hast deine Ausbildung zum Mechatroniker oder zur Mechatronikerin gerade abgeschlossen? Bei Kessler Antriebstechnik in Heilbronn steigst du als Junior in die Instandhaltung unserer Montagelinien ein. Ein Pate oder eine Patin begleitet dich im ersten Jahr. Dazu gibt es Weiterbildungsbudget, Jobrad und eine Kantine mit Zuschuss."
    expect: []

  - id: "ad-010"
    title: "Reinigungskraft (m/w/d) in Teilzeit"
    text: "Glanzwerk Gebäudeservice reinigt Büros und Praxen in Leipzig-Süd. Die Arbeitszeit liegt werktags zwischen 17 und 21 Uhr. Wir stellen Material und Arbeitskleidung. Bitte geben Sie im Lebenslauf Ihren Familienstand und die Anzahl Ihrer Kinder an."
    expect: ["family"]

  - id: "ad-011"
    title: "Production Operator (m/f/d) – Plastics"
    text: "Kunststoffwerk Ahrens in Lüdenscheid produces injection-moulded parts for the automotive industry. You set up and run our machines, check part quality and document the shift. Join our young and dynamic team and grow with us. Three-shift system with shift bonuses and a company pension."
    expect: ["age"]

  - id: "ad-012"
    title: "Altenpfleger (m/w/d) für Wohnbereich"
    text: "Das Seniorenzentrum Rosengarten in Hildesheim betreut 90 Bewohnerinnen und Bewohner in vier Wohnbereichen. Sie planen und dokumentieren die Pflege, begleiten Visiten und leiten Pflegehilfskräfte an. Deutschkenntnisse mindestens B2. Wir bieten feste Teams, Zuschläge und einen Zuschuss zum Deutschlandticket."
    german_level: {min: "B2", justification: ""}
    expect: ["german-without-reason"]

  - id: "ad-013"
    title: "Fachkraft für Lagerlogistik (w/m/d)"
    text: "Bei Rheinland Ersatzteile in Neuss lagern wir Teile für Landmaschinen. Die Tätigkeit ist körperlich anspruchsvoll: Regelmäßig werden Kartons bis 20 kg bewegt, Hebehilfen und Vakuumheber stehen zur Verfügung. Ein Staplerschein ist wünschenswert, den Kurs finanzieren wir sonst. Wir bieten Gleitzeit im Frühdienst und eine betriebliche Altersvorsorge."
    expect: []

  - id: "ad-014"
    title: "Maler und Lackierer (m/w/d)"
    text: "Malerbetrieb Strobel ist ein Familienbetrieb in dritter Generation im Allgäu. Sie gestalten Fassaden, tapezieren und lackieren in Neubau und Altbau. Bewerbende mit deutscher Staatsangehörigkeit werden bevorzugt. Wir zahlen über Tarif und stellen einen Firmentransporter."
    expect: ["origin-nationality"]

  - id: "ad-015"
    title: "Kommissionierer Frischelager"
    text: "Für unser Frischelager in Hamm suchen wir ab sofort Verstärkung im Frühdienst ab 5 Uhr. Sie stellen Bestellungen für Supermärkte zusammen und arbeiten mit Pick-by-Voice. Kälteschutzkleidung wird gestellt. Unbefristeter Vertrag und Zuschläge für Kühlbereiche."
    expect: ["gender-title"]

  - id: "ad-016"
    title: "Pflegehelfer (m/w/d) im Nachtdienst"
    text: "Das Haus am Stadtpark in Gera sucht Unterstützung für den Nachtdienst. Sie helfen bei der Grundpflege, begleiten nächtliche Rundgänge und unterstützen die Pflegefachkraft. Bitte teilen Sie uns in Ihrer Bewerbung mit, ob eine Schwangerschaft besteht. Nachtzuschläge und feste Nachtdienstwochen."
    expect: ["pregnancy-health"]

  - id: "ad-017"
    title: "Hausmeister (m/w/d) für Wohnanlage"
    text: "Die Wohnbau Talblick GmbH verwaltet 400 Wohnungen in Siegen. Sie übernehmen kleinere Reparaturen, kontrollieren Heizungsanlagen und kümmern sich um die Außenanlagen. Wir erwarten die Zugehörigkeit zu einer christlichen Kirche. Dienstwohnung auf Wunsch möglich."
    expect: ["religion"]

  - id: "ad-018"
    title: "Busfahrer:in im Linienverkehr"
    text: "Linienbus Weserbogen bringt jeden Tag 18.000 Fahrgäste ans Ziel. Unser Fahrteam ist zwischen 23 und 64 Jahre alt und kommt aus neun Ländern. Den Führerschein Klasse D kannst du bei uns während der bezahlten Ausbildung machen. Feste Dienstpläne vier Wochen im Voraus und ein Zuschuss zur Kinderbetreuung."
    german_level: {min: "B1", justification: "Fahrgastauskünfte und der Funkverkehr mit der Leitstelle laufen auf Deutsch."}
    expect: []

  - id: "ad-019"
    title: "Küchenhilfe (m/w/d) Großküche"
    text: "Die Kantine Werkhof in Wolfsburg versorgt täglich 800 Gäste. Sie unterstützen beim Vorbereiten, Portionieren und an der Spülstraße. Sie sind kräftig gebaut und packen auch bei großen Töpfen mit an. Ein Gesundheitszeugnis nach § 43 IfSG ist erforderlich. Arbeitszeit Montag bis Freitag, keine Wochenenden."
    expect: ["physical"]

  - id: "ad-020"
    title: "Lkw-Fahrer gesucht – Fernverkehr"
    text: "Transporte Wiedemann aus Passau fährt Komplettladungen nach Italien und Österreich. Wir suchen einen Mann mit Erfahrung im Fernverkehr, der gerne mehrere Tage unterwegs ist. Führerschein CE, Fahrerkarte und ADR-Schein sind Voraussetzung. Spesen und Wochenendzuschläge werden pünktlich gezahlt."
    expect: ["gender-title", "gender-only"]

  - id: "ad-021"
    title: "Tischler (m/w/d) Möbelbau und Innenausbau"
    text: "Die Werkstatt Hobelspan in Freiburg baut Einzelmöbel und Küchen aus Massivholz. Du arbeitest an der CNC und von Hand, baust beim Kunden ein und planst mit. Schick uns gern Fotos von Möbelstücken, die du gebaut hast – ein Foto von dir brauchen wir nicht. Wir bieten eine Vier-Tage-Woche und Werkstattnutzung für eigene Projekte."
    expect: []

  - id: "ad-022"
    title: "Dispatcher (m/f/d) – Transport Planning"
    text: "Wegmann Logistics in Duisburg plans regional truck routes for retail customers. You assign tours, handle calls from drivers and react to delays in real time. You are a native German speaker and comfortable with telematics software. Hybrid work after the probation period and a monthly mobility budget."
    expect: ["origin-native-language"]

  - id: "ad-023"
    title: "Bäckereifachverkäufer (m/w/d)"
    text: "Bäckerei Sonnenkorn hat sieben Filialen im Raum Oldenburg. Sie beraten unsere Kundschaft, backen Snacks auf und kümmern sich um die Präsentation der Ware. Sie sind zwischen 20 und 35 Jahre alt und haben Freude am Verkauf. Bewerbungen bitte mit Foto an personal@sonnenkorn.example."
    expect: ["age", "photo"]

  - id: "ad-024"
    title: "Fliesenleger (m/w/d) – Quereinstieg möglich"
    text: "Fliesen Kaya in Offenbach verlegt Fliesen und Naturstein in Bädern, Küchen und auf Terrassen. Auch Quereinsteigende jeden Alters arbeiten wir sorgfältig ein. In unserem Team wird Deutsch, Türkisch und Polnisch gesprochen. Wir zahlen pünktlich, stellen Werkzeug und Arbeitskleidung und haben einen festen Kundenstamm."
    expect: []

  - id: "ad-025"
    title: "Disponent (m/w/d) Spedition"
    text: "Für unsere Niederlassung in Ulm suchen wir Unterstützung in der Disposition von 30 Fahrzeugen. Sie planen Touren, kommunizieren mit Kundschaft und Fahrpersonal und behalten die Lenkzeiten im Blick. Wir wünschen uns eine gefestigte Persönlichkeit, idealerweise verheiratet und sesshaft. Unbefristete Festanstellung und 30 Tage Urlaub."
    expect: ["family"]

  - id: "ad-026"
    title: "Produktionshelfer (m/w/d) Lebensmittel"
    text: "Die Feinkost Tannenberg GmbH in Cuxhaven stellt Salate und Dips für den Handel her. Sie bestücken Abfüllanlagen, kontrollieren Etiketten und reinigen die Linie nach Schichtende. Verstärken Sie unser junges Schichtteam. Gute Deutschkenntnisse auf B1-Niveau setzen wir voraus."
    german_level: {min: "B1", justification: ""}
    expect: ["german-without-reason", "age"]

  - id: "ad-027"
    title: "Pflegefachfrau / Pflegefachmann (m/w/d) Kurzzeitpflege"
    text: "Die Kurzzeitpflege Am Mühlbach in Fulda nimmt Gäste nach Krankenhausaufenthalten auf. Sie gestalten Aufnahmen und Entlassungen, koordinieren mit Sozialdienst und Hausärzten und leiten Auszubildende an. Schwerbehinderte Bewerberinnen und Bewerber werden bei gleicher Eignung bevorzugt berücksichtigt. Wir bieten Dienstplansicherheit und ein Springerkonzept."
    german_level: {min: "B2", justification: "Pflegedokumentation, Übergaben und Gespräche mit Angehörigen erfolgen auf Deutsch."}
    expect: []

  - id: "ad-028"
    title: "Gabelstaplerfahrer (m/w/d)"
    text: "Holzhandel Brenner in Rosenheim sucht Verstärkung im Außenlager. Sie be- und entladen Lkw, lagern Plattenware ein und kommissionieren für die Abholung. Bitte legen Sie Ihrer Bewerbung Angaben zu einer etwaigen Schwerbehinderung und zu chronischen Erkrankungen bei. Staplerschein ist Voraussetzung."
    expect: ["pregnancy-health"]

  - id: "ad-029"
    title: "Anlagenmechaniker SHK"
    text: "Haustechnik Lemke in Lüneburg ist ein Meisterbetrieb mit zwölf Beschäftigten. Du installierst Wärmepumpen, modernisierst Bäder und übernimmst Wartungen bei unserer Stammkundschaft. Wir bieten ein eigenes Servicefahrzeug, Tablet und Bereitschaft nur jede sechste Woche. Bewerbung einfach über heizung-lemke.example/jobs."
    expect: ["gender-title"]

  - id: "ad-030"
    title: "Delivery Driver (all genders) – Same Day"
    text: "Kurierwerk Berlin delivers parcels and groceries in the inner city with electric vans. You plan your stops with our app and hand over deliveries to customers. A class B licence held for at least two years is required. EU citizens only. Paid per hour, not per parcel, with a monthly bonus for punctuality."
    expect: ["origin-nationality"]

  - id: "ad-031"
    title: "Line Cook (m/f/d) – Brasserie"
    text: "Brasserie Lamarck in Düsseldorf serves French classics for up to 150 covers a night. You run your own station, prepare sauces and keep the line clean during service. A food hygiene instruction under § 43 IfSG (Gesundheitszeugnis) is required before your first shift; we help you book the appointment. Split shifts are not part of our schedule."
    expect: []

  - id: "ad-032"
    title: "Haushaltshilfe (m/w/d) für Seniorenhaushalte"
    text: "Alltagshelden Nordheide unterstützt ältere Menschen im Landkreis Harburg im Alltag. Sie übernehmen Einkäufe, leichte Hausarbeiten und begleiten zu Arztterminen. Wir suchen eine liebe Dame, die Geduld mitbringt und gerne zuhört. Freie Zeiteinteilung zwischen 8 und 16 Uhr, Kilometergeld wird erstattet."
    expect: ["gender-only"]

  - id: "ad-033"
    title: "Möbelmonteur (m/w/d) Küchenmontage"
    text: "Küchenwelt Haberl montiert Küchen im Raum Augsburg und München. Sie bauen Schränke auf, setzen Arbeitsplatten zu und schließen Geräte an. Sie sind mindestens 1,80 m groß und sportlich. Wir bieten Montagepauschalen und einen festen Montagepartner."
    expect: ["physical"]

  - id: "ad-034"
    title: "Hauswirtschafterin für Seniorenresidenz"
    text: "Die privat geführte Seniorenresidenz Am Kurpark in Bad Kissingen sucht Verstärkung für Wäscherei und Speisenversorgung. Sie planen den Wäschekreislauf, organisieren das Frühstücksbuffet und achten auf Hygienestandards. Wir setzen die Mitgliedschaft in einer der großen christlichen Kirchen voraus. Teilzeit ab 25 Stunden möglich."
    expect: ["gender-title", "religion"]

  - id: "ad-035"
    title: "Mitarbeiter*in Wareneingang"
    text: "Bei Spielwaren Kranich in Fürth kommen jeden Tag bis zu 20 Lkw an. Du prüfst Lieferungen, buchst Ware im System ein und klärst Abweichungen mit dem Einkauf. Erfahrung mit Handscannern ist von Vorteil. Wir bieten Gleitzeit, einen Zuschuss zum Jobticket und Mitarbeiterrabatt."
    expect: []

  - id: "ad-036"
    title: "Fahrer:in für Kurierdienst"
    text: "Blitzbote Hannover liefert Laborproben und Dokumente für Arztpraxen und Kanzleien. Für unser Kurierteam suchen wir Leute Anfang bis Mitte zwanzig, die die Stadt gut kennen. Führerschein Klasse B ist Pflicht, das Fahrzeug stellen wir. Minijob oder Teilzeit möglich."
    expect: ["age"]

  - id: "ad-037"
    title: "Care Assistant (m/f/d) – Nursing Home"
    text: "Haus Abendrot in Lübeck is a nursing home with 70 residents and a garden by the Trave. You help residents with daily care, meals and activities. German B1 required. We offer a fixed team, a monthly shift plan and support with recognition if you have foreign care qualifications."
    german_level: {min: "B1", justification: ""}
    expect: ["german-without-reason"]

  - id: "ad-038"
    title: "Gärtner (m/w/d) Garten- und Landschaftsbau"
    text: "Grünwerk Taunus legt Gärten an, pflastert Wege und pflegt Grünanlagen von Wohnanlagen. Bei uns arbeiten Jung und Alt Hand in Hand – vom Berufseinstieg bis kurz vor der Rente. Führerschein BE ist wünschenswert. Wir bieten Winterarbeit statt Kurzarbeit und Bezahlung nach Tarif GaLaBau."
    expect: []

  - id: "ad-039"
    title: "Rezeptionist Hotel Garni"
    text: "Das Hotel Uferlicht in Lindau hat 28 Zimmer direkt an der Uferpromenade. Sie empfangen Gäste, betreuen Buchungen und geben Ausflugstipps. Sprachkenntnisse in Englisch sind wichtig. Bewerbung bitte mit Foto und Zeugnissen an rezeption@uferlicht-lindau.example."
    expect: ["gender-title", "photo"]

  - id: "ad-040"
    title: "Pflegeassistenz (m/w/d) stationär"
    text: "Das Pflegeheim Waldesruh in Detmold sucht Verstärkung in einem Wohnbereich mit 30 Plätzen. Sie unterstützen bei Körperpflege, Mahlzeiten und Mobilisation. Da unsere Schichten kurzfristig wechseln können, sollten Sie keine kleinen Kinder zu betreuen haben. Wir zahlen Zuschläge für Wochenenden und Feiertage."
    expect: ["family"]

  - id: "ad-041"
    title: "Schweißer (m/w/d) MAG/WIG"
    text: "Stahlbau Petersen in Husum fertigt seit 1987 Stahlkonstruktionen für Hallen und Windparks. Sie schweißen Bauteile nach Zeichnung in der Werkhalle. Eine gültige Schweißerprüfung nach DIN EN ISO 9606 ist Voraussetzung, Nachprüfungen übernehmen wir. Wir bieten einen unbefristeten Vertrag und Weihnachtsgeld."
    expect: []

  - id: "ad-042"
    title: "Kundendienstmonteur (m/w/d) Heizungstechnik"
    text: "Wärme Service Nord betreut über 3.000 Heizungsanlagen im Raum Kiel. Sie warten und reparieren Gas- und Ölheizungen direkt bei der Kundschaft. Sie sprechen Deutsch auf C1-Niveau, idealerweise als Muttersprachler. Servicefahrzeug, Diensthandy und eine faire Bereitschaftsregelung."
    german_level: {min: "C1", justification: ""}
    expect: ["origin-native-language", "german-without-reason"]

  - id: "ad-043"
    title: "Fahrzeugpfleger (m/w/d)"
    text: "Autohaus Rebmann in Pforzheim sucht Verstärkung für die Aufbereitung von Neu- und Gebrauchtwagen. Wir suchen einen zuverlässigen Kerl, der Autos liebt und sauber arbeitet. Sie reinigen innen und außen, polieren und bereiten Übergaben vor. Arbeitszeiten Montag bis Freitag, samstags nur nach Absprache."
    expect: ["gender-only"]

  - id: "ad-044"
    title: "Electrician (all genders) – Industrial Maintenance"
    text: "Fischbach Papier in Düren runs paper machines around the clock. You maintain motors, drives and control cabinets and help troubleshoot during breakdowns. We offer visa support and help with the recognition of foreign qualifications. Relocation bonus and company apartment for the first six months."
    german_level: {min: "A2", justification: "Safety briefings and lockout procedures on site are given in German."}
    expect: []

  - id: "ad-045"
    title: "Restaurantfachmann (m/w/d)"
    text: "Das Gasthaus Zum Löwen in Konstanz verbindet badische Küche mit gutem Wein. Sie beraten Gäste, empfehlen passende Weine und organisieren Familienfeiern. Wir suchen junge Leute, die Lust auf Gastronomie haben. Geteilte Dienste gibt es bei uns nicht, Trinkgeld bleibt im Team."
    expect: ["age"]

  - id: "ad-046"
    title: "Packer für Umzugsunternehmen"
    text: "Umzüge Wendland ist in ganz Brandenburg unterwegs, von Einzimmerwohnungen bis zu Firmenumzügen. Sie verpacken Hausrat, tragen Möbel und beladen unsere Fahrzeuge. Sie sind kräftig und körperlich belastbar. Bezahlung pro Stunde plus Trinkgeld, auch als Aushilfe möglich."
    expect: ["gender-title", "physical"]

  - id: "ad-047"
    title: "Pflegehilfskraft (w/m/d) Tagespflege"
    text: "Die Tagespflege Sonnenhof in Bayreuth betreut bis zu 22 Gäste werktags von 8 bis 16 Uhr. Du begleitest Gäste durch den Tag, hilfst bei Mahlzeiten und gestaltest Beschäftigungsangebote. Wir planen familienfreundlich, ohne Nachtdienst und ohne Wochenenden, und zahlen einen Kita-Zuschuss. Eine Pflegebasisqualifikation ist wünschenswert, aber kein Muss."
    expect: []

  - id: "ad-048"
    title: "Gebäudereiniger (m/w/d) Unterhaltsreinigung"
    text: "Sauber & Co. reinigt Schulen und Verwaltungsgebäude im Kreis Recklinghausen. Sie arbeiten im Team mit festen Objekten und festen Zeiten am Nachmittag. Wir bevorzugen deutsche Bewerberinnen und Bewerber. Tarifliche Bezahlung nach Rahmentarifvertrag Gebäudereinigung."
    expect: ["origin-nationality"]

  - id: "ad-049"
    title: "Barista (all genders) – Specialty Coffee"
    text: "Röstwerk Kaffeebar in Leipzig roasts its own beans and runs two cafés. You prepare espresso drinks, talk coffee with guests and keep the bar spotless. Barista experience is a plus, not a must. Please include a recent photo with your application to hello@roestwerk-leipzig.example."
    expect: ["photo"]

  - id: "ad-050"
    title: "Maurer (m/w/d) Hochbau"
    text: "Bauunternehmung Gerlach in Kaiserslautern errichtet Ein- und Mehrfamilienhäuser. Sie mauern, schalen und betonieren nach Plan. Voraussetzung: keine gesundheitlichen Einschränkungen und keine Rückenleiden. Wir zahlen nach Bautarif, stellen Fahrzeuge zur Baustelle und gewähren Winterausgleich."
    expect: ["pregnancy-health"]

  - id: "ad-051"
    title: "Berufskraftfahrer:in C/CE Getränkelogistik"
    text: "Getränke Hartwig beliefert Gastronomie und Märkte rund um Würzburg. Du fährst feste Touren, lieferst mit Hubwagen und Ladebordwand aus und nimmst Leergut zurück. Führerschein C/CE, Fahrerkarte und Modul 95 sind Voraussetzung. Nach der Tour ist Feierabend, keine Übernachtungen."
    german_level: {min: "B1", justification: "Lieferpapiere, Gespräche bei der Anlieferung und die Abstimmung mit der Disposition laufen auf Deutsch."}
    expect: []

  - id: "ad-052"
    title: "Montagehelfer (m/w/d) Fensterbau"
    text: "Fensterbau Krüger in Rostock produziert und montiert Kunststoff- und Holzfenster. Sie unterstützen das Montageteam beim Ausbau alter Fenster und beim Einbau neuer Elemente. Deutschkenntnisse auf A2-Niveau sind Pflicht. Führerschein Klasse B ist von Vorteil."
    german_level: {min: "A2", justification: ""}
    expect: ["german-without-reason"]

  - id: "ad-053"
    title: "Hauswirtschaftshilfe in Teilzeit"
    text: "Für unsere Wohngruppe für Menschen mit Unterstützungsbedarf in Marburg suchen wir Unterstützung bei Einkauf, Kochen und Wäsche. Die Arbeitszeit liegt bei 20 Stunden pro Woche, vormittags. Bitte geben Sie in Ihrer Bewerbung Ihren Familienstand an. Wir bieten ein kleines, herzliches Team und flexible Urlaubsplanung."
    expect: ["gender-title", "family"]

  - id: "ad-054"
    title: "Werkstatthelfer*in Metallbau"
