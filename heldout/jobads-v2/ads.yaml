ads:
  - id: ad-001
    title: "Pflegefachkraft (m/w/d) für unser Seniorenzentrum in Bielefeld-Brackwede"
    text: "Das Haus Lindenhof Brackwede betreut 84 Bewohnerinnen und Bewohner in vier Wohnbereichen. Sie übernehmen die Behandlungspflege, planen die Pflege und arbeiten eng mit Hausarztpraxen und Therapeut*innen zusammen. Wir zahlen nach Haustarif mit Jahressonderzahlung, 30 Urlaubstage und einen festen Dienstplan, der vier Wochen im Voraus steht. Voraussetzung ist eine abgeschlossene Ausbildung als Pflegefachkraft sowie der Nachweis über den Masernschutz nach § 20 IfSG. Bewerbungen gern per E-Mail an karriere@lindenhof-brackwede.example."
    german_level: {min: "B2", justification: "Pflegedokumentation, Übergaben und Gespräche mit Bewohner*innen, Angehörigen und Ärztinnen und Ärzten erfolgen auf Deutsch."}
    expect: []

  - id: ad-002
    title: "Koch (m/w/d) in Vollzeit – Bistro Kornblume, Köln-Ehrenfeld"
    text: "Unsere Küche ist klein, ehrlich und saisonal: mittags Tagesgerichte, abends eine kurze Karte. Für unser junges Team suchen wir ab sofort Verstärkung am Herd. Sie bereiten die Mise en place vor, kochen à la minute und achten auf Hygiene und Warenrotation. Kein Teildienst, Montag und Dienstag sind Ruhetage. Eine Belehrung nach § 43 IfSG bringen Sie mit oder holen sie mit unserer Hilfe nach."
    german_level: {min: "B1", justification: ""}
    expect: [age, german-without-reason]

  - id: ad-003
    title: "Warehouse Associate (all genders) – Day Shift, Erfurt"
    text: "Nordhafen Parts Distribution ships spare parts for agricultural machinery to dealers across Europe. You pick and pack orders with handheld scanners, load pallets and check incoming goods against delivery notes. Cartons weigh up to 20 kg and you are on your feet for most of the shift; lifting aids and safety shoes are provided. Shifts run 6:00–14:30, Monday to Friday, with a shift bonus. No previous warehouse experience needed – we train you on the job."
    expect: []

  - id: ad-004
    title: "Elektriker für Gebäudeinstallation gesucht"
    text: "Elektro Brandtner GmbH aus Regensburg installiert und wartet Elektroanlagen in Wohn- und Gewerbebauten. Sie verlegen Leitungen, setzen Verteilungen und nehmen Anlagen nach VDE in Betrieb. Wir bieten einen Firmenwagen für die Baustellenfahrten, pünktliche Bezahlung über Tarif und Weiterbildung bis zur Meisterprüfung. Eine abgeschlossene Ausbildung als Elektroniker*in für Energie- und Gebäudetechnik oder vergleichbar setzen wir voraus."
    expect: [gender-title]

  - id: ad-005
    title: "Reinigungskraft (m/w/d) für Büroobjekte in Hannover-List"
    text: "Glanzwerk Gebäudeservice reinigt Büros und Arztpraxen in der Region Hannover. Ihre Einsatzzeiten liegen werktags zwischen 17 und 21 Uhr, gern auch auf Minijob-Basis. Sie reinigen Arbeitsplätze, Sanitärräume und Küchen nach Leistungsverzeichnis. Da Sie direkten Kontakt zu unseren Auftraggebern haben, setzen wir Deutsch als Muttersprache voraus. Arbeitskleidung und Reinigungsmittel stellen wir."
    expect: [origin-native-language]

  - id: ad-006
    title: "Berufskraftfahrer CE (m/w/d) im Fernverkehr – Wochenendheimfahrer"
    text: "Spedition Kalvelage & Söhne fährt Stückgut und Komplettladungen zwischen Westfalen, Benelux und Norditalien. Sie sind von Montag bis Freitag unterwegs und am Wochenende zu Hause. Sie fahren moderne Sattelzüge mit Standklima, unsere Disposition plant die Touren so, dass Lenk- und Ruhezeiten eingehalten werden. Sie besitzen den Führerschein CE, eine gültige Fahrerkarte und die Schlüsselzahl 95; ADR ist willkommen, aber kein Muss."
    expect: []

  - id: ad-007
    title: "Verkäuferin für unsere Bäckereifiliale in Fürth"
    text: "Die Landbäckerei Wiesentaler hat elf Filialen rund um Nürnberg. Für unsere Filiale am Fürther Bahnhofsplatz suchen wir eine freundliche Verkäuferin, die morgens gern früh startet. Sie bedienen unsere Kundschaft, belegen Brötchen und halten die Theke sauber. Es gibt Personalrabatt, Zuschläge für Sonntagsarbeit und eine feste Monatsplanung."
    expect: [gender-title, gender-only]

  - id: ad-008
    title: "Hotelfachfrau/-mann (m/w/d) für Rezeption und Etage"
    text: "Das Landhotel Seewinkel am Chiemsee hat 46 Zimmer und ein kleines Restaurant. Sie arbeiten im Wechsel an der Rezeption, im Frühstücksservice und bei der Kontrolle der Zimmer. Wir bieten eine Fünf-Tage-Woche, ein bezahltes Mittagessen pro Schicht und auf Wunsch ein Zimmer im Personalhaus. Senden Sie uns bitte Ihren Lebenslauf und ein Foto an jobs@seewinkel-hotel.example."
    expect: [photo]

  - id: ad-009
    title: "Line Cook (m/f/d) – Burger Kitchen, Berlin-Friedrichshain"
    text: "Smash & Salt is a busy burger kitchen with 60 covers and a strong delivery business. You run the grill or fryer station, prep sauces and keep your section spotless during service. We pay above the Berlin average, share tips fairly between front and back of house and give you a free staff meal every shift. As our kitchen works closely with the front-of-house staff, we are looking for a native German speaker."
    expect: [origin-native-language]

  - id: ad-010
    title: "Lagerhelfer (m/w/d) für Getränkegroßhandel in Kassel"
    text: "Getränke Ruppert beliefert Gastronomie und Vereine in Nordhessen. Sie kommissionieren Bestellungen, beladen unsere Lkw und sortieren Leergut. Gesucht wird eine kräftig gebaute Person, die zupacken kann. Wir zahlen 15,50 € pro Stunde, Arbeitsbeginn ist um 6 Uhr, freitags ist um 13 Uhr Schluss."
    expect: [physical]

  - id: ad-011
    title: "Kaufmann/-frau für Büromanagement (m/w/d) im Großhandel"
    text: "Hessler Werkzeughandel verkauft Präzisionswerkzeuge an Industrie und Handwerk. Sie bearbeiten Aufträge im ERP, pflegen Stammdaten, schreiben Rechnungen und koordinieren Termine mit unserem Außendienst. Sie arbeiten in Gleitzeit, zwei Tage pro Woche können Sie im Homeoffice verbringen. Wir freuen uns über alle Bewerbungen, unabhängig von Alter, Geschlecht, Herkunft, Religion, Behinderung oder sexueller Identität. Ihre Unterlagen senden Sie bitte über www.hessler-werkzeug.example/karriere."
    expect: []

  - id: ad-012
    title: "Altenpflegehelfer*in in Teilzeit – Familiendienst möglich"
    text: "In der Tagespflege Sonnenhang in Ulm begleiten wir täglich bis zu 22 Gäste. Sie unterstützen bei der Körperpflege, bei Mahlzeiten und Aktivitäten und fahren gelegentlich im Fahrdienst mit. Unser Familiendienst von 8 bis 13 Uhr passt zu Kita- und Schulzeiten. Wir zahlen zusätzlich einen monatlichen Zuschuss zu Kita-Gebühren von bis zu 150 €. Eine Ausbildung in der Pflegehilfe ist von Vorteil, Quereinsteiger*innen arbeiten wir sorgfältig ein."
    expect: []

  - id: ad-013
    title: "Maler und Lackierer (m/w/d) – Altbausanierung in Leipzig"
    text: "Farbwerk Hoyer saniert Gründerzeitfassaden und Treppenhäuser im Leipziger Westen. Sie spachteln, tapezieren, lackieren und übernehmen auch Stuck- und Lasurarbeiten. Arbeit auf Gerüsten gehört dazu. Wenn Sie mögen, legen Sie Ihrer Bewerbung ein paar Fotos von Projekten bei, an denen Sie mitgearbeitet haben – das ist aber kein Muss. Bewerbungen an info@farbwerk-hoyer.example."
    expect: []

  - id: ad-014
    title: "Kurierfahrer (m/w/d) für Expresssendungen im Raum Stuttgart"
    text: "Blitzpost Süd liefert eilige Dokumente und Ersatzteile für Kanzleien und Werkstätten. Sie fahren einen unserer Transporter bis 3,5 t und planen Ihre Touren mit unserer App. Sie haben einen Führerschein der Klasse B, kennen sich im Großraum Stuttgart aus und sind höchstens 40 Jahre alt. Wir bieten Festanstellung statt Subunternehmerschaft und bezahlte Überstunden."
    expect: [age]

  - id: ad-015
    title: "Servicekraft (m/w/d) für unser Weinrestaurant in Bernkastel-Kues"
    text: "Das Weinhaus Moselblick bietet regionale Küche und über 200 Weine von der Mittelmosel. Sie begrüßen unsere Gäste, beraten zu Speisen und Weinen und kassieren am Tisch. Wir bieten geregelte Arbeitszeiten, ein faires Trinkgeldsystem und Weinschulungen bei unseren Partnerweingütern. Bitte nennen Sie in Ihrer Bewerbung neben Ihrer Erfahrung auch Ihren Familienstand."
    expect: [family]

  - id: ad-016
    title: "Office Cleaner (m/f/d) – Evening Shifts, Frankfurt Westend"
    text: "Brightline Facility Services cleans offices for law firms and consultancies in Frankfurt. You work Monday to Friday from 18:00 to 21:00, emptying bins, cleaning desks and kitchens and vacuuming. All cleaning equipment and uniforms are provided, and we pay 14.25 € per hour. Applications are only considered from EU citizens."
    expect: [origin-nationality]

  - id: ad-017
    title: "Produktionsmitarbeiter:in im Dreischichtbetrieb"
    text: "Bei Kessler Verpackungstechnik in Gütersloh fertigen wir Faltschachteln für Lebensmittel und Pharma. Sie bedienen Stanz- und Klebemaschinen, kontrollieren die Qualität und dokumentieren Ihre Schicht. Unser Schichtplan entsteht gemeinsam im Team: Wer an religiösen Feiertagen wie Ostern, dem Zuckerfest oder Jom Kippur frei haben möchte, trägt das frühzeitig ein, und wir planen entsprechend. Wir zahlen Schichtzulagen, einen Fahrtkostenzuschuss und eine Erfolgsbeteiligung."
    expect: []

  - id: ad-018
    title: "Zimmermädchen in Vollzeit – Hotel am Stadtpark"
    text: "Das Hotel am Stadtpark in Bamberg ist ein familiengeführtes Haus mit 70 Zimmern. Unser Zimmermädchen reinigt die Gästezimmer, bezieht Betten und füllt Minibars und Pflegeprodukte auf. Wir suchen eine zuverlässige Frau, die sorgfältig arbeitet. Die Arbeitszeit ist von 8 bis 15 Uhr, jedes zweite Wochenende ist frei."
    expect: [gender-title, gender-only]

  - id: ad-019
    title: "Kfz-Mechatroniker (m/w/d) für freie Werkstatt"
    text: "Autoservice Demirel in Duisburg repariert Fahrzeuge aller Marken, von der Inspektion bis zur Motorinstandsetzung. Sie führen Diagnosen durch, tauschen Verschleißteile und bereiten Fahrzeuge für die HU vor. Wir erwarten eine abgeschlossene Ausbildung und dass Sie keinerlei gesundheitliche Einschränkungen haben. Dafür gibt es moderne Hebebühnen, gutes Werkzeug und 13 Monatsgehälter."
    expect: [pregnancy-health]

  - id: ad-020
    title: "Kaufmännische Sachbearbeitung (m/w/d) Einkauf – Elektrogroßhandel"
    text: "Elektro Oberhauser ist ein Großhandel für Elektroinstallationsmaterial mit 40 Beschäftigten. Sie holen Angebote ein, bestellen bei Herstellern und überwachen Liefertermine. Als christlich geprägtes Unternehmen setzen wir die Mitgliedschaft in einer der christlichen Kirchen voraus. Wir bieten einen unbefristeten Vertrag, Gleitzeit und betriebliche Altersvorsorge."
    expect: [religion]

  - id: ad-021
    title: "Köch*in für unsere Betriebskantine in Mannheim"
    text: "Die Kantine der Rheinhafen-Gruppe Mannheim versorgt täglich rund 350 Beschäftigte. Sie kochen zwei Hauptgerichte und ein vegetarisches Angebot pro Tag und arbeiten nach HACCP. Arbeitszeit ist Montag bis Freitag von 6:30 bis 15 Uhr, keine Abende, keine Wochenenden. Vor Arbeitsbeginn benötigen Sie eine Erstbelehrung nach § 43 Infektionsschutzgesetz, die Kosten dafür übernehmen wir."
    expect: []

  - id: ad-022
    title: "Forklift Driver (all genders) – Cold Storage Hub, Bremen"
    text: "Polarstern Kühllogistik stores and ships frozen food for retail chains. You move pallets between the loading docks and the freezer aisles at –22 °C and load trucks according to the loading plan. Thermal workwear is provided, and every 90 minutes you take a warm-up break. A valid forklift licence (Staplerschein) is required; we offer a two-week paid induction and a cold-storage bonus."
    expect: []

  - id: ad-023
    title: "Pflegehelfer (m/w/d) für unsere Wohngemeinschaft für Menschen mit Demenz"
    text: "In der Demenz-WG Am Rosengarten in Kiel leben zehn Mieterinnen und Mieter mit ihrem eigenen Tagesrhythmus. Sie begleiten den Alltag, kochen gemeinsam mit den Bewohner*innen und unterstützen bei der Grundpflege. Wir arbeiten in festen Teams mit Dienstplänen, die sich nach Ihren Wünschen richten. Eine Pflegebasisqualifikation ist von Vorteil, wir bilden Sie aber auch selbst weiter."
    german_level: {min: "B1", justification: ""}
    expect: [german-without-reason]

  - id: ad-024
    title: "Gärtner (m/w/d) im Garten- und Landschaftsbau"
    text: "GrünRaum Weber plant und baut Privatgärten im Raum Freiburg. Sie pflastern Wege, setzen Mauern, pflanzen und pflegen Anlagen über das ganze Jahr. Sie sind zwischen 25 und 45 Jahre alt und haben Freude an sichtbaren Ergebnissen. Wir bieten Ganzjahresbeschäftigung ohne Winterpause, Firmenfahrzeuge und eine Prämie für jedes abgeschlossene Projekt."
    expect: [age]

  - id: ad-025
    title: "Fliesenleger (m/w/d) – Bad und Küche, Raum Augsburg"
    text: "Fliesen Gruber ist ein Meisterbetrieb mit acht Fliesenleger*innen und zwei Meistern. Sie verlegen Fliesen und Naturstein, bauen bodengleiche Duschen und arbeiten Silikonfugen sauber nach. Die Arbeit findet viel im Knien statt, Fliesenpakete wiegen bis zu 25 kg; für das Material gibt es Treppensteiger und Transportkarren. Knieschoner, Werkzeug und Firmenwagen stellen wir."
    expect: []

  - id: ad-026
    title: "Küchenhilfe in Teilzeit für Seniorenheim-Küche"
    text: "Die Zentralküche der Stiftung Abendrot in Gera kocht täglich für drei Pflegeeinrichtungen. Sie helfen bei der Vorbereitung von Gemüse und Salaten, portionieren Speisen und reinigen Geräte. Arbeitszeit ist von 7 bis 12:30 Uhr, dazu jedes zweite Wochenende. Wir zahlen nach TVöD und bieten ein vergünstigtes Deutschlandticket. Eine Belehrung nach § 43 IfSG organisieren wir für Sie."
    expect: [gender-title]

  - id: ad-027
    title: "Rezeptionist (m/w/d) im Frühdienst – Stadthotel Rheinblick"
    text: "Das Stadthotel Rheinblick in Koblenz empfängt viele Geschäftsreisende und Radtouristen. Sie checken Gäste ein und aus, beantworten Anfragen per Telefon und Mail und erstellen Rechnungen in unserem Hotelprogramm. Der Frühdienst beginnt um 6 Uhr und endet um 14:30 Uhr. Bitte schicken Sie uns Ihren Lebenslauf mit aktuellem Lichtbild an rezeption@rheinblick-koblenz.example."
    expect: [photo]

  - id: ad-028
    title: "Delivery Driver – Grocery Delivery, Munich"
    text: "Gemüsekiste Isar delivers organic produce boxes to households across Munich in electric vans. You load your van at our hub in the morning and deliver around 60 boxes per tour. You'll join a young and energetic team that loves good food. A category B driving licence is required, and we pay 15 € per hour plus a delivery bonus."
    expect: [gender-title, age]

  - id: ad-029
    title: "Sachbearbeiter*in Disposition – Baustofflogistik"
    text: "Baustoffe Lammers beliefert Baustellen in Ostfriesland mit Kran- und Kipperfahrzeugen. Sie planen die täglichen Touren unserer 25 Fahrzeuge, nehmen Aufträge telefonisch entgegen und stimmen sich mit den Baustellen ab. Wir bieten eine 38-Stunden-Woche, ein Jobrad und eine gründliche Einarbeitung durch das bestehende Team. Berufseinsteiger*innen mit kaufmännischer Ausbildung sind willkommen."
    german_level: {min: "C1", justification: "Sie telefonieren den ganzen Tag mit Polieren, Kund*innen und Fahrer*innen und klären kurzfristige Änderungen am Telefon."}
    expect: []

  - id: ad-030
    title: "Montagehelfer (m/w/d) für Fenster und Türen"
    text: "Fensterbau Lindqvist montiert Kunststoff- und Aluminiumfenster in Neubauten im Raum Hamburg. Sie unterstützen unsere Montageteams beim Ausbau alter Fenster, beim Einsetzen und Abdichten. Wir bieten einen Stundenlohn von 16 €, Werkzeug und Arbeitskleidung. Voraussetzung ist die deutsche Staatsangehörigkeit."
    expect: [origin-nationality]

  - id: ad-031
    title: "Friseur*in in Voll- oder Teilzeit – Salon Haarwerk Mitte"
    text: "Haarwerk Mitte ist ein Salon mit sechs Plätzen in Magdeburg. Sie schneiden, färben und beraten unsere Kundschaft und gestalten Ihren Terminkalender mit. Wir zahlen ein Fixgehalt plus Umsatzbeteiligung und übernehmen zwei Fortbildungen pro Jahr. Ob Sie gerade Ihre Gesellenprüfung abgelegt haben oder seit Jahrzehnten im Beruf sind – wir freuen uns auf Ihre Bewerbung."
    expect: []

  - id: ad-032
    title: "Verkäufer (m/w/d) in der Gartenabteilung – Baumarkt Hornbeck"
    text: "Der Baumarkt Hornbeck in Oldenburg hat eine große Garten- und Pflanzenabteilung. Sie beraten Kundinnen und Kunden zu Pflanzen, Erde und Bewässerung und pflegen die Ware. Wir arbeiten im Schichtbetrieb von 7 bis 20 Uhr, auch samstags. Bitte teilen Sie uns in Ihrer Bewerbung mit, ob Sie Kinder haben und wie alt diese sind."
    expect: [family]

  - id: ad-033
    title: "Industriemechaniker (m/w/d) für die Instandhaltung"
    text: "Walzwerk Hennings in Siegen stellt kaltgewalzte Bandstähle her. Sie warten und reparieren Walzgerüste, Hydraulik und Getriebe und arbeiten im Bereitschaftsdienst mit. Für die Arbeiten an unseren Anlagen sollten Sie mindestens 1,80 m groß sein. Wir zahlen nach IG-Metall-Tarif, mit Schichtzulagen und Urlaubsgeld."
    expect: [physical]

  - id: ad-034
    title: "Housekeeping Attendant (m/f/d) – Boutique Hotel, Hamburg"
    text: "Hotel Elbkante is a 38-room boutique hotel in Hamburg-Altona. You clean and prepare guest rooms, restock amenities and report anything that needs fixing to our maintenance team. Our housekeeping team of nine speaks five languages between them, and new colleagues are trained by a buddy for their first two weeks. Applications are welcome from everyone, whatever your age, background, religion or gender."
    expect: []

  - id: ad-035
    title: "Hauswirtschafter:in für unsere Seniorenresidenz"
    text: "Die Seniorenresidenz Am Alten Markt in Cottbus bietet betreutes Wohnen für 60 Mieter*innen. Sie organisieren die Wäscheversorgung, unterstützen in der Küche und planen gemeinsam mit den Bewohner*innen Feste und Ausflüge. Bitte bringen Sie den Masernschutznachweis mit, der für Einrichtungen wie unsere gesetzlich vorgeschrieben ist. Wir bieten unbefristete Verträge, 30 Tage Urlaub und Dienstplanung nach Wunsch."
    expect: []

  - id: ad-036
    title: "Lkw-Fahrer (m/w/d) Nahverkehr – Baustoffhandel"
    text: "Baustoffhandel Rieger in Passau beliefert Handwerksbetriebe und Privathaushalte. Sie fahren einen Dreiachser mit Ladekran und liefern Baustoffe direkt auf die Baustelle. Für diese Aufgabe suchen wir einen zuverlässigen Mann mit Führerschein C/CE. Abends sind Sie zu Hause, Überstunden werden bezahlt."
    expect: [gender-only]

  - id: ad-037
    title: "Gebäudereiniger (m/w/d) für Glas- und Fassadenreinigung"
    text: "Klarsicht Dienstleistungen reinigt Glasfassaden und Wintergärten in Düsseldorf und Umgebung. Sie arbeiten mit Teleskopstangen, Osmoseanlagen und auf Hubarbeitsbühnen. Weil Sie häufig mit unseren Auftraggebern sprechen, erwarten wir akzentfreies Deutsch. Ihre Bewerbung schicken Sie bitte inklusive Foto an personal@klarsicht-duesseldorf.example."
    expect: [origin-native-language, photo]

  - id: ad-038
    title: "Bäcker (m/w/d) in der Backstube – Nachtschicht"
    text: "Die Backstube Kranzler in Rostock backt jede Nacht für neun Filialen. Sie stellen Teige her, formen Brote und Brötchen und bedienen den Etagenofen. Die Schicht beginnt um 1 Uhr und endet gegen 9 Uhr; dafür gibt es steuerfreie Nachtzuschläge und eine Vier-Tage-Woche. Eine abgeschlossene Ausbildung als Bäcker*in oder mehrjährige Erfahrung in einer Backstube bringen Sie mit."
    expect: []

  - id: ad-039
    title: "Kommissionierer (m/w/d) im Onlinehandel – Spätschicht"
    text: "Bei Versandhaus Lorenzen in Neumünster packen wir täglich rund 8.000 Pakete mit Haushaltswaren. Sie kommissionieren mit dem Handscanner, verpacken Bestellungen und bereiten Retouren auf. Sie sind körperlich belastbar und arbeiten gern zügig. Die Spätschicht geht von 14 bis 22:30 Uhr, es gibt eine Spätschichtzulage von 15 %."
    expect: [physical]

  - id: ad-040
    title: "Kitchen Porter (all genders) – Hotel Restaurant, Heidelberg"
    text: "The restaurant at Hotel Neckarbogen serves breakfast and dinner for up to 120 guests. You keep the dishwashing area running, clean pots and equipment and help with simple prep like peeling vegetables. Shifts are 15:00–23:00, five days a week, with meals included. A food-hygiene instruction (Belehrung nach § 43 IfSG) is needed before your first day – we will book the appointment for you."
    german_level: {min: "A2", justification: ""}
    expect: [german-without-reason]

  - id: ad-041
    title: "Pflegefachkraft für die ambulante Intensivpflege"
    text: "Intensivpflege Nordlicht versorgt beatmete Klient*innen in ihrer eigenen Wohnung im Raum Lübeck. Sie betreuen eine Person im festen Team, arbeiten in 12-Stunden-Diensten und haben dafür mehr freie Tage am Stück. Wir bieten eine Intensivpflegezulage, ein eigenes Dienstfahrrad und eine Fachweiterbildung Außerklinische Intensivpflege. Voraussetzung ist eine dreijährige Ausbildung in der Pflege und der gesetzlich vorgeschriebene Masernschutznachweis."
    expect: [gender-title]

  - id: ad-042
    title: "Busfahrer (m/w/d) im Linienverkehr – Landkreis Vechta"
    text: "Omnibus Thölken betreibt Regionalbuslinien im Landkreis Vechta. Sie fahren feste Linien nach Fahrplan, verkaufen Fahrscheine und helfen Fahrgästen mit Rollstuhl oder Kinderwagen beim Einstieg. Führerschein D mit Schlüsselzahl 95 ist Voraussetzung; wer nur Klasse B hat, kann bei uns den Busführerschein auf Firmenkosten machen. Geteilte Dienste gibt es nur auf Wunsch, und der Dienstplan steht zwei Monate im Voraus fest."
    expect: []

  - id: ad-043
    title: "Bürokraft (m/w/d) in Teilzeit für unseren Sanitärgroßhandel"
    text: "Sanitär Klewitz in Wuppertal ist ein Familienbetrieb mit 18 Beschäftigten. Sie nehmen Telefonate an, erfassen Lieferscheine und bereiten die Buchhaltung vor. Wir wünschen uns eine gut organisierte neue Kollegin, die unsere Chefin im Büro entlastet. Arbeitszeit ist vormittags von 8 bis 12 Uhr, Gehalt nach Vereinbarung."
    expect: [gender-only]

  - id: ad-044
    title: "Schweißer (m/w/d) MAG/WIG – Stahlbau"
    text: "Stahlbau Petersen in Husum fertigt Hallenkonstruktionen und Treppen. Sie schweißen Bauteile nach Zeichnung in unserer Werkstatt und gelegentlich auf Montage. Sie haben gültige Schweißerprüfungen nach DIN EN ISO 9606-1 und sind nicht älter als 50. Wir bieten Tariflohn, Montagezulagen und eine moderne Absauganlage in der Halle."
    expect: [age]

  - id: ad-045
    title: "Spülkraft (m/w/d) für Gasthaus Zum Hirschen"
    text: "Das Gasthaus Zum Hirschen in Ochsenfurt ist bekannt für fränkische Küche und Hochzeitsfeiern. Sie bedienen die Spülmaschine, reinigen Töpfe und Bleche und halten die Küche sauber. Gearbeitet wird vor allem abends und am Wochenende, auch als Minijob möglich. Für alle Tätigkeiten mit Lebensmitteln brauchen Sie die Belehrung nach § 43 IfSG – haben Sie sie noch nicht, gehen wir gemeinsam zum Gesundheitsamt."
    expect: []

  - id: ad-046
    title: "Office Assistant (m/f/d) – Import/Export Trading Company, Hamburg"
    text: "Hanseatic Spice Traders imports spices and dried fruit from Asia and Africa. You support our sales team with order entry, shipping documents and customer correspondence in English. We are looking for candidates up to 30 years of age who want to grow with us. Please send your CV including a photo to careers@hanseatic-spice.example."
    expect: [photo, age]

  - id: ad-047
    title: "Fachverkäufer*in Fleischerei – Filiale Bad Tölz"
