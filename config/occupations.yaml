# Occupations the pipeline recognises, with what candidates actually write in each supported
# language. `regulated: true` means a foreign qualification must be formally recognised
# (Anerkennung) before the person may work in the occupation in Germany; for the others
# recognition is optional but helps with pay grading.
# Matching on aliases is word-bounded and longest-first; aliases under `any` are tried in every
# conversation language (German job titles are used by everyone).

