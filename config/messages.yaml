# What the assistant says, per language. Placeholders in {braces}. German uses "du", as most
# WhatsApp recruiting does; switch the texts here, not in code.

de:
  intro: "Hallo{name}! Ich bin der digitale Assistent von {company}, eine KI, kein Mensch. Ich stelle dir ein paar kurze Fragen{job_part}. Deine Angaben nutzen wir nur für deine Bewerbung und löschen sie nach {retention_months} Monaten, wenn es nicht passt. Details: {privacy_url}\nBist du einverstanden?"
  job_part: " zur Stelle {job}"
  consent_question: "Bist du einverstanden?"
  consent_yes: "Ja, los geht's"
  consent_no: "Nein danke"
  consent_declined: "Alles klar, wir speichern nichts von dir. Wenn du es dir anders überlegst, schreib einfach „Start“."
  open_question: "Danke! Erzähl kurz in deinen Worten: Was ist dein Beruf, wie lange machst du das schon, welchen Führerschein hast du, wo wohnst du und ab wann könntest du anfangen?"
  ask:
    occupation: "Als was arbeitest du bzw. was hast du gelernt?"
    qualification: "Hast du eine abgeschlossene Ausbildung oder ein Examen in dem Beruf? Wenn ja: in Deutschland oder in einem anderen Land?"
    recognition: "Ist dein Abschluss in Deutschland schon anerkannt (Anerkennung), läuft der Antrag, oder noch nicht?"
    licences: "Welche Führerscheine oder Scheine hast du (z. B. B, C, CE, Code 95, Staplerschein, ADR)?"
    location: "Wo wohnst du? Die Postleitzahl reicht."
    commute: "Wie weit kannst du maximal zur Arbeit fahren (km oder Minuten)?"
    shifts: "Welche Schichten gehen für dich: früh, spät, nachts, Wochenende?"
    start_date: "Ab wann könntest du anfangen?"
    german_level: "Wie gut sprichst du Deutsch (z. B. A2, B1, B2 oder in eigenen Worten)?"
    experience_years: "Wie viele Jahre Berufserfahrung hast du?"
    employment: "Suchst du Vollzeit oder Teilzeit?"
    email: "Für die Bewerbung brauchen wir noch deine E-Mail-Adresse."
    full_name: "Wie heißt du mit Vor- und Nachnamen?"
  confirm: "Ich habe notiert:\n{summary}\nStimmt das so?"
  confirm_yes: "Stimmt"
  confirm_fix: "Korrigieren"
  fix_prompt: "Was soll ich ändern? Schreib es einfach."
  matched: "Danke! Du passt zu: {jobs}. Jemand aus dem Team meldet sich bis {deadline} bei dir."
  near_miss: "Danke! Für {jobs} fehlt noch: {gaps}. Das lässt sich oft lösen, jemand aus dem Team meldet sich bis {deadline} und bespricht den Weg mit dir."
  no_match: "Danke! Gerade passt keine offene Stelle genau. Dürfen wir dich {retention_months} Monate im Talentpool behalten und uns melden, wenn etwas passt?"
  pool_yes: "Ja, gern"
  pool_no: "Nein, löschen"
  pool_saved: "Prima, wir melden uns, sobald etwas passt."
  deleted: "Verstanden. Wir schreiben dir nicht mehr und haben deine Daten gelöscht."
  human: "Ich gebe dich an eine Kollegin bzw. einen Kollegen weiter. Wir melden uns bis {deadline}."
  not_understood: "Das habe ich leider nicht verstanden. {question}"
  voice: "Sprachnachrichten kann ich gerade nicht anhören. Schreib es mir bitte kurz."
  reminder: "Hallo, zu deiner Bewerbung bei {company} fehlt nur noch: {missing}. Antworte einfach hier."
  labels: {confirmation: Bestätigung, occupation: Beruf, qualification: Abschluss, recognition: Anerkennung, licences: Führerscheine/Scheine, location: Wohnort, commute: Fahrweg, shifts: Schichten, start_date: Start, german_level: Deutsch, experience_years: Erfahrung, employment: Umfang, email: E-Mail, full_name: Name}
  values: {domestic: in Deutschland, foreign: im Ausland, none: keiner, recognised: anerkannt, in_progress: läuft, not_started: noch nicht, not_needed: nicht nötig, full_time: Vollzeit, part_time: Teilzeit, immediately: sofort, years: Jahre, all_shifts: alle Schichten, no_shift: keine, early: früh, late: spät, night: nachts, weekend: Wochenende, "yes": ja, "no": nein, forklift: "Staplerschein", tachograph_card: "Fahrerkarte"}

en:
  intro: "Hi{name}! I'm the digital assistant of {company}, an AI, not a person. I'll ask you a few short questions{job_part}. We only use your answers for your application and delete them after {retention_months} months if it doesn't work out. Details: {privacy_url}\nIs that OK with you?"
  job_part: " about the {job} job"
  consent_question: "Is that OK with you?"
  consent_yes: "Yes, let's go"
  consent_no: "No thanks"
  consent_declined: "All right, we won't store anything about you. If you change your mind, just write \"Start\"."
  open_question: "Thanks! Tell me in your own words: what is your job, how long have you done it, which driving licence do you have, where do you live and when could you start?"
  ask:
    occupation: "What do you work as, or what did you train as?"
    qualification: "Do you have a completed vocational qualification or exam in this job? If yes: in Germany or another country?"
    recognition: "Has your qualification been recognised in Germany yet (Anerkennung), is the application in progress, or not yet?"
    licences: "Which licences or certificates do you have (e.g. B, C, CE, Code 95, forklift, ADR)?"
    location: "Where do you live? The postcode is enough."
    commute: "How far can you travel to work at most (km or minutes)?"
    shifts: "Which shifts work for you: early, late, nights, weekends?"
    start_date: "When could you start?"
    german_level: "How good is your German (e.g. A2, B1, B2, or in your own words)?"
    experience_years: "How many years of work experience do you have?"
    employment: "Are you looking for full-time or part-time?"
    email: "For the application we still need your email address."
    full_name: "What is your first and last name?"
  confirm: "Here's what I noted:\n{summary}\nIs that right?"
  confirm_yes: "That's right"
  confirm_fix: "Correct it"
  fix_prompt: "What should I change? Just write it."
  matched: "Thanks! You fit: {jobs}. Someone from the team will get back to you by {deadline}."
  near_miss: "Thanks! For {jobs} this is still missing: {gaps}. That can often be solved; someone from the team will get back to you by {deadline} to talk it through."
  no_match: "Thanks! No open job fits exactly right now. May we keep you in our talent pool for {retention_months} months and contact you when something fits?"
  pool_yes: "Yes, please"
  pool_no: "No, delete"
  pool_saved: "Great, we'll be in touch as soon as something fits."
  deleted: "Understood. We won't message you again and have deleted your data."
  human: "I'm passing you on to a colleague. We'll get back to you by {deadline}."
  not_understood: "Sorry, I didn't understand that. {question}"
  voice: "I can't listen to voice messages right now. Please write it briefly."
  reminder: "Hi, your application with {company} is only missing: {missing}. Just reply here."
  labels: {confirmation: confirmation, occupation: Job, qualification: Qualification, recognition: Recognition, licences: Licences, location: Home, commute: Commute, shifts: Shifts, start_date: Start, german_level: German, experience_years: Experience, employment: Hours, email: Email, full_name: Name}
  values: {domestic: in Germany, foreign: abroad, none: none, recognised: recognised, in_progress: in progress, not_started: not yet, not_needed: not needed, full_time: full-time, part_time: part-time, immediately: immediately, years: years, all_shifts: all shifts, no_shift: none, early: early, late: late, night: nights, weekend: weekends, "yes": yes, "no": no, forklift: "forklift licence", tachograph_card: "driver card"}

tr:
  intro: "Merhaba{name}! Ben {company} şirketinin dijital asistanıyım; bir yapay zekâyım, insan değilim. Sana{job_part} birkaç kısa soru soracağım. Bilgilerini yalnızca başvurun için kullanırız ve uygun olmazsa {retention_months} ay sonra sileriz. Ayrıntılar: {privacy_url}\nKabul ediyor musun?"
  job_part: " {job} pozisyonu için"
  consent_question: "Kabul ediyor musun?"
  consent_yes: "Evet, başlayalım"
  consent_no: "Hayır, teşekkürler"
  consent_declined: "Tamam, hakkında hiçbir şey kaydetmiyoruz. Fikrini değiştirirsen \"Start\" yazman yeterli."
  open_question: "Teşekkürler! Kendi cümlelerinle kısaca anlat: mesleğin ne, ne zamandır yapıyorsun, hangi ehliyetin var, nerede yaşıyorsun ve ne zaman başlayabilirsin?"
  ask:
    occupation: "Hangi meslekte çalışıyorsun veya hangi mesleği öğrendin?"
    qualification: "Bu meslekte tamamlanmış bir eğitimin veya sınavın var mı? Varsa: Almanya'da mı, başka bir ülkede mi?"
    recognition: "Diploman Almanya'da tanındı mı (denklik), başvurun sürüyor mu, yoksa henüz değil mi?"
    licences: "Hangi ehliyet veya belgelerin var (ör. B, C, CE, Code 95, forklift, ADR)?"
    location: "Nerede yaşıyorsun? Posta kodu yeterli."
    commute: "İşe en fazla ne kadar yol gidebilirsin (km veya dakika)?"
    shifts: "Hangi vardiyalar sana uyar: sabah, akşam, gece, hafta sonu?"
    start_date: "Ne zaman başlayabilirsin?"
    german_level: "Almancan ne seviyede (ör. A2, B1, B2 veya kendi sözlerinle)?"
    experience_years: "Kaç yıllık iş deneyimin var?"
    employment: "Tam zamanlı mı yarı zamanlı mı arıyorsun?"
    email: "Başvuru için e-posta adresine de ihtiyacımız var."
    full_name: "Adın ve soyadın nedir?"
  confirm: "Şunları not ettim:\n{summary}\nDoğru mu?"
  confirm_yes: "Doğru"
  confirm_fix: "Düzelt"
  fix_prompt: "Neyi değiştireyim? Yazman yeterli."
  matched: "Teşekkürler! Şu pozisyonlara uyuyorsun: {jobs}. Ekipten biri {deadline} tarihine kadar sana dönecek."
  near_miss: "Teşekkürler! {jobs} için şu eksik: {gaps}. Bu çoğu zaman çözülebilir; ekipten biri {deadline} tarihine kadar seninle konuşacak."
  no_match: "Teşekkürler! Şu an tam uyan açık pozisyon yok. Seni {retention_months} ay aday havuzumuzda tutup uygun bir şey olunca yazabilir miyiz?"
  pool_yes: "Evet, olur"
  pool_no: "Hayır, silin"
  pool_saved: "Harika, uygun bir şey olunca yazarız."
  deleted: "Anlaşıldı. Sana bir daha yazmayacağız ve verilerini sildik."
  human: "Seni bir çalışma arkadaşıma aktarıyorum. {deadline} tarihine kadar dönüş yapacağız."
  not_understood: "Maalesef anlayamadım. {question}"
  voice: "Şu an sesli mesajları dinleyemiyorum. Lütfen kısaca yaz."
  reminder: "Merhaba, {company} başvurunda sadece şu eksik: {missing}. Buradan yanıtlaman yeterli."
  labels: {confirmation: onay, occupation: Meslek, qualification: Diploma, recognition: Denklik, licences: Ehliyet/belgeler, location: Yaşadığın yer, commute: Yol, shifts: Vardiyalar, start_date: Başlangıç, german_level: Almanca, experience_years: Deneyim, employment: Çalışma süresi, email: E-posta, full_name: Ad}
  values: {domestic: Almanya'da, foreign: yurt dışında, none: yok, recognised: tanındı, in_progress: sürüyor, not_started: henüz değil, not_needed: gerekmiyor, full_time: tam zamanlı, part_time: yarı zamanlı, immediately: hemen, years: yıl, all_shifts: tüm vardiyalar, no_shift: hiçbiri, early: sabah, late: akşam, night: gece, weekend: hafta sonu, "yes": evet, "no": hayır, forklift: "forklift belgesi", tachograph_card: "takograf kartı"}

pl:
  intro: "Cześć{name}! Jestem cyfrowym asystentem firmy {company}, czyli AI, nie człowiekiem. Zadam Ci kilka krótkich pytań{job_part}. Twoje dane wykorzystujemy tylko do rekrutacji i usuwamy je po {retention_months} miesiącach, jeśli nie będzie pasować. Szczegóły: {privacy_url}\nZgadzasz się?"
  job_part: " dotyczących stanowiska {job}"
  consent_question: "Zgadzasz się?"
  consent_yes: "Tak, zaczynamy"
  consent_no: "Nie, dziękuję"
  consent_declined: "W porządku, nic o Tobie nie zapisujemy. Jeśli zmienisz zdanie, napisz po prostu „Start”."
  open_question: "Dziękuję! Opisz krótko własnymi słowami: jaki masz zawód, jak długo w nim pracujesz, jakie masz prawo jazdy, gdzie mieszkasz i od kiedy możesz zacząć?"
  ask:
    occupation: "W jakim zawodzie pracujesz lub czego się uczyłeś/uczyłaś?"
    qualification: "Czy masz ukończone wykształcenie zawodowe lub egzamin w tym zawodzie? Jeśli tak: w Niemczech czy w innym kraju?"
    recognition: "Czy Twój dyplom jest już uznany w Niemczech (Anerkennung), wniosek jest w toku, czy jeszcze nie?"
    licences: "Jakie masz prawa jazdy lub uprawnienia (np. B, C, CE, Code 95, wózek widłowy, ADR)?"
    location: "Gdzie mieszkasz? Wystarczy kod pocztowy."
    commute: "Jak daleko możesz maksymalnie dojeżdżać do pracy (km lub minuty)?"
    shifts: "Które zmiany Ci pasują: rano, popołudnie, noc, weekend?"
    start_date: "Od kiedy możesz zacząć?"
    german_level: "Jak dobrze mówisz po niemiecku (np. A2, B1, B2 lub własnymi słowami)?"
    experience_years: "Ile lat doświadczenia zawodowego masz?"
    employment: "Szukasz pełnego etatu czy części etatu?"
    email: "Do aplikacji potrzebujemy jeszcze Twojego adresu e-mail."
    full_name: "Jak się nazywasz (imię i nazwisko)?"
  confirm: "Zanotowałem:\n{summary}\nCzy to się zgadza?"
  confirm_yes: "Zgadza się"
  confirm_fix: "Popraw"
  fix_prompt: "Co mam zmienić? Po prostu napisz."
  matched: "Dziękuję! Pasujesz do: {jobs}. Ktoś z zespołu odezwie się do {deadline}."
  near_miss: "Dziękuję! Do {jobs} brakuje jeszcze: {gaps}. Często da się to załatwić; ktoś z zespołu odezwie się do {deadline} i omówi z Tobą drogę."
  no_match: "Dziękuję! Teraz żadna oferta nie pasuje dokładnie. Czy możemy zatrzymać Cię przez {retention_months} miesięcy w bazie kandydatów i odezwać się, gdy coś się pojawi?"
  pool_yes: "Tak, chętnie"
  pool_no: "Nie, usuńcie"
  pool_saved: "Świetnie, odezwiemy się, gdy coś będzie pasować."
  deleted: "Rozumiem. Nie będziemy już pisać i usunęliśmy Twoje dane."
  human: "Przekazuję Cię koleżance lub koledze. Odezwiemy się do {deadline}."
  not_understood: "Niestety nie zrozumiałem. {question}"
  voice: "Nie mogę teraz odsłuchać wiadomości głosowych. Napisz proszę krótko."
  reminder: "Cześć, w Twojej aplikacji do {company} brakuje tylko: {missing}. Odpowiedz po prostu tutaj."
  labels: {confirmation: potwierdzenie, occupation: Zawód, qualification: Wykształcenie, recognition: Uznanie, licences: Prawo jazdy/uprawnienia, location: Miejsce zamieszkania, commute: Dojazd, shifts: Zmiany, start_date: Start, german_level: Niemiecki, experience_years: Doświadczenie, employment: Wymiar, email: E-mail, full_name: Imię i nazwisko}
  values: {domestic: w Niemczech, foreign: za granicą, none: brak, recognised: uznane, in_progress: w toku, not_started: jeszcze nie, not_needed: niepotrzebne, full_time: pełny etat, part_time: część etatu, immediately: od zaraz, years: lat, all_shifts: wszystkie zmiany, no_shift: żadna, early: rano, late: popołudnie, night: noc, weekend: weekend, "yes": tak, "no": nie, forklift: "wózek widłowy (UDT)", tachograph_card: "karta kierowcy"}

ro:
  intro: "Bună{name}! Sunt asistentul digital al {company}, o inteligență artificială, nu un om. Îți pun câteva întrebări scurte{job_part}. Folosim datele tale doar pentru candidatură și le ștergem după {retention_months} luni dacă nu se potrivește. Detalii: {privacy_url}\nEști de acord?"
  job_part: " despre postul de {job}"
  consent_question: "Ești de acord?"
  consent_yes: "Da, să începem"
  consent_no: "Nu, mulțumesc"
  consent_declined: "În regulă, nu salvăm nimic despre tine. Dacă te răzgândești, scrie doar „Start”."
  open_question: "Mulțumesc! Spune-mi pe scurt, cu cuvintele tale: ce meserie ai, de cât timp o faci, ce permis de conducere ai, unde locuiești și de când poți începe?"
  ask:
    occupation: "Ce meserie ai sau ce ai învățat?"
    qualification: "Ai o calificare sau un examen terminat în această meserie? Dacă da: în Germania sau în altă țară?"
    recognition: "Diploma ta este deja recunoscută în Germania (Anerkennung), cererea este în curs sau încă nu?"
    licences: "Ce permise sau atestate ai (de ex. B, C, CE, Code 95, stivuitor, ADR)?"
    location: "Unde locuiești? Codul poștal este suficient."
    commute: "Cât de departe poți face naveta la muncă cel mult (km sau minute)?"
    shifts: "Ce ture ți se potrivesc: dimineața, după-amiaza, noaptea, weekend?"
    start_date: "De când poți începe?"
    german_level: "Cât de bine vorbești germana (de ex. A2, B1, B2 sau cu cuvintele tale)?"
    experience_years: "Câți ani de experiență ai?"
    employment: "Cauți normă întreagă sau jumătate de normă?"
    email: "Pentru candidatură avem nevoie și de adresa ta de e-mail."
    full_name: "Cum te numești (prenume și nume)?"
  confirm: "Am notat:\n{summary}\nEste corect?"
  confirm_yes: "Corect"
  confirm_fix: "Corectează"
  fix_prompt: "Ce să schimb? Scrie-mi pur și simplu."
  matched: "Mulțumesc! Te potrivești pentru: {jobs}. Cineva din echipă te contactează până la {deadline}."
  near_miss: "Mulțumesc! Pentru {jobs} mai lipsește: {gaps}. De obicei se poate rezolva; cineva din echipă te contactează până la {deadline}."
  no_match: "Mulțumesc! Momentan niciun post nu se potrivește exact. Putem să te păstrăm {retention_months} luni în baza de candidați și să te contactăm când apare ceva?"
  pool_yes: "Da, sigur"
  pool_no: "Nu, ștergeți"
  pool_saved: "Super, te contactăm când apare ceva potrivit."
  deleted: "Am înțeles. Nu îți mai scriem și ți-am șters datele."
  human: "Te trimit la un coleg sau o colegă. Revenim până la {deadline}."
  not_understood: "Din păcate nu am înțeles. {question}"
  voice: "Momentan nu pot asculta mesaje vocale. Te rog să scrii pe scurt."
  reminder: "Bună, la candidatura ta la {company} mai lipsește doar: {missing}. Răspunde aici."
  labels: {confirmation: confirmare, occupation: Meserie, qualification: Calificare, recognition: Recunoaștere, licences: Permise/atestate, location: Domiciliu, commute: Navetă, shifts: Ture, start_date: Început, german_level: Germană, experience_years: Experiență, employment: Normă, email: E-mail, full_name: Nume}
  values: {domestic: în Germania, foreign: în străinătate, none: niciunul, recognised: recunoscută, in_progress: în curs, not_started: încă nu, not_needed: nu e necesar, full_time: normă întreagă, part_time: jumătate de normă, immediately: imediat, years: ani, all_shifts: toate turele, no_shift: niciuna, early: dimineața, late: după-amiaza, night: noaptea, weekend: weekend, "yes": da, "no": nu, forklift: "atestat stivuitor", tachograph_card: "card tahograf"}

uk:
  intro: "Привіт{name}! Я цифровий асистент компанії {company}, штучний інтелект, а не людина. Я поставлю тобі кілька коротких запитань{job_part}. Ми використовуємо твої дані лише для заявки й видаляємо їх через {retention_months} місяців, якщо не підійде. Деталі: {privacy_url}\nТи згоден/згодна?"
  job_part: " щодо вакансії {job}"
  consent_question: "Ти згоден/згодна?"
  consent_yes: "Так, почнімо"
